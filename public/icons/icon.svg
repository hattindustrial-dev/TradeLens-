<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <rect width="192" height="192" rx="32" fill="#0a0c0b"/>
  <!-- Reference line -->
  <line x1="24" y1="96" x2="168" y2="96" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <!-- Arrow -->
  <line x1="96" y1="96" x2="60" y2="148" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <polygon points="60,148 52,132 68,136" fill="#f59e0b"/>
  <!-- Fillet symbol below reference line (arrow side) -->
  <polygon points="72,104 72,140 108,140" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linejoin="round"/>
  <!-- All-around circle at junction -->
  <circle cx="96" cy="96" r="8" fill="none" stroke="#22c55e" stroke-width="3"/>
  <!-- TL monogram area - top right -->
  <text x="118" y="74" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#e0e8e4" letter-spacing="-1">TL</text>
</svg>
